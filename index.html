<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空き状況カレンダー</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  :root {
    --brown: #403934;
    --brown-light: #8C796C;
    --line: #E4DED8;
    --bg: #FAF8F6;
    --gray: #EEEBE8;
    --green: #4E8A55;
    --sat: #DCE8F7;
    --sat-text: #3A6EA5;
    --sun: #F7DEDE;
    --sun-text: #C0504D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 8px 24px;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--brown);
    background: var(--bg);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .menu { font-size: 14px; color: var(--brown-light); margin-bottom: 10px; }
  .note {
    font-size: 13px; line-height: 1.6;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 12px;
  }

  /* 週の切り替え */
  .nav { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .nav button {
    font-size: 14px; color: var(--brown);
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; flex: 1;
  }
  .nav button:disabled { color: #C8C2BC; }
  .back-menu {
    display: block; width: 100%; margin-bottom: 8px;
    font-size: 14px; color: var(--brown-light);
    background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px;
  }
  .week-label { font-size: 13px; color: var(--brown-light); margin-bottom: 8px; text-align: center; }

  /* 週表 */
  table { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
  th, td { text-align: center; padding: 0; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--gray); font-size: 13px; padding: 4px 0; border-radius: 4px;
  }
  thead th .month { display: block; font-size: 11px; color: var(--brown-light); }
  thead th .date { display: block; font-size: 16px; font-weight: bold; }
  thead th.sat { background: var(--sat); color: var(--sat-text); }
  thead th.sun { background: var(--sun); color: var(--sun-text); }
  th.time-head { width: 50px; }
  td.time { font-size: 12px; font-weight: bold; background: var(--gray); border-radius: 4px; height: 44px; }
  td.cell { background: #fff; border-radius: 4px; height: 44px; }
  td.cell.off { background: var(--gray); }
  td.cell.full { color: #C8C2BC; font-size: 14px; }
  td.cell button {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; border: none; background: none; padding: 0;
    color: var(--green); font-size: 22px; font-weight: bold; font-family: inherit;
  }
  td.cell button:disabled { color: #C8C2BC; }

  /* 読み込み中の枠 */
  td.cell.loading, td.time.loading { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .loading-text { text-align: center; font-size: 13px; color: var(--brown-light); margin: 8px 0; }

  .message { text-align: center; font-size: 14px; color: var(--brown-light); padding: 24px 0; }
  .error { color: var(--sun-text); }
</style>
</head>
<body>
  <h1>ご希望の日時をお選びください</h1>
  <div class="menu" id="menu"></div>

  <div class="note">
    ご希望の日時の <strong>○</strong> をタップしてください。<br>
    LINEのトーク画面に、ご予約内容の確認が表示されます。
  </div>

  <button id="btn-menu" class="back-menu">← メニューを選び直す</button>

  <div class="nav">
    <button id="btn-first">直近の空き</button>
    <button id="btn-prev">‹ 前の週</button>
    <button id="btn-next">次の週 ›</button>
  </div>
  <div class="week-label" id="week-label"></div>

  <div id="calendar"></div>

<script>
  // ===== 設定（ご自身の値に書き換えてください） =====
  const LIFF_ID = '2011965863-h9A4Rz8Z';
  const DATA_URL = 'https://script.google.com/macros/s/AKfycbxPi1f04WbnDZAbaBQhvt5LyYx5Rarp-BwvVDLY5-x6NMEr5Yx9owCyHKcvRB03JBst/exec';
  // ==================================================

  // menu：メニュー / exclude・mode：日時変更のとき（変更する予約の行番号と、変更の種類）
  const CONFIG = { menu: '', exclude: '', mode: '', dataUrl: DATA_URL };
  let current = null;   // 今表示している週のデータ
  let sending = false;  // 送信中（連打を防ぐ）

  // 予約ボットの窓口から、データを受け取る
  // 失敗したときは、少し待ってから1回だけ自動でやり直す
  function fetchData(params, retried) {
    const query = Object.keys(params).map(function(key) {
      return key + '=' + encodeURIComponent(params[key]);
    }).join('&');

    return fetch(CONFIG.dataUrl + '?' + query)
      .then(function(res) { return res.json(); })
      .catch(function(err) {
        if (retried) throw err;
        return new Promise(function(resolve) { setTimeout(resolve, 1000); })
          .then(function() { return fetchData(params, true); });
      });
  }

  // 全部の週（受付期間ぶん）を、最初に1回だけまとめて受け取る
  let allData = null;
  let weekIndex = 0;

  function handleData(data) {
    if (data.error || !data.weeks || data.weeks.length === 0) throw new Error(data.error || 'no data');
    allData = data;
    showWeek(0);
  }

  // 指定した週を表示する（通信はしない）
  function showWeek(index) {
    weekIndex = index;
    const week = allData.weeks[index];
    current = {
      menu: allData.menu,
      duration: allData.duration,
      times: allData.times,
      days: week.days,
      weeksFromNow: week.weeksFromNow,
      prevWeek: index > 0,
      nextWeek: index < allData.weeks.length - 1
    };
    render(current);
  }

  // 一番近い空きがある週へ移動する（通信はしない）
  function showFirst() {
    for (let i = 0; i < allData.weeks.length; i++) {
      const hasSlot = allData.weeks[i].days.some(function(day) { return day.slots.length > 0; });
      if (hasSlot) {
        showWeek(i);
        return;
      }
    }
    showMessage('申し訳ありません。現在、ご案内できる空きがありません。');
  }

  // 読み込みを待つ間、今週の日付と表の枠だけを先に出しておく
  function renderSkeleton() {
    const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
    const today = new Date();
    const monday = new Date(today);
    monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'time-head';
    headRow.appendChild(corner);

    for (let i = 0; i < 7; i++) {
      const date = new Date(monday);
      date.setDate(monday.getDate() + i);

      const th = document.createElement('th');
      if (date.getDay() === 6) th.className = 'sat';
      if (date.getDay() === 0) th.className = 'sun';

      const month = document.createElement('span');
      month.className = 'month';
      month.textContent = (i === 0 || date.getDate() === 1) ? (date.getMonth() + 1) + '月' : '\u00a0';
      const day = document.createElement('span');
      day.className = 'date';
      day.textContent = date.getDate();
      const name = document.createElement('span');
      name.textContent = '(' + dayNames[date.getDay()] + ')';

      th.appendChild(month);
      th.appendChild(day);
      th.appendChild(name);
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (let r = 0; r < 8; r++) {
      const tr = document.createElement('tr');
      const timeCell = document.createElement('td');
      timeCell.className = 'time loading';
      tr.appendChild(timeCell);
      for (let c = 0; c < 7; c++) {
        const td = document.createElement('td');
        td.className = 'cell loading';
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    const area = document.getElementById('calendar');
    area.innerHTML = '';
    const text = document.createElement('div');
    text.className = 'loading-text';
    text.textContent = '空き状況を読み込んでいます…';
    area.appendChild(text);
    area.appendChild(table);
    document.getElementById('week-label').textContent = '今週';
  }

  function showLoadError() {
    showMessage('空き状況を読み込めませんでした。時間をおいて、もう一度開いてください。', true);
  }

  // 週表を組み立てる（文字はすべて textContent で入れる）
  function render(data) {
    document.getElementById('menu').textContent =
      'メニュー：' + data.menu + '（' + data.duration + '分）';

    document.getElementById('week-label').textContent =
      data.weeksFromNow === 0 ? '今週' : '今日から ' + data.weeksFromNow + ' 週間後';

    const table = document.createElement('table');

    // 見出し（日付）
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'time-head';
    headRow.appendChild(corner);

    data.days.forEach(function(day, i) {
      const th = document.createElement('th');
      if (day.weekday === 6) th.className = 'sat';
      if (day.weekday === 0) th.className = 'sun';

      const month = document.createElement('span');
      month.className = 'month';
      month.textContent = (i === 0 || day.day === 1) ? day.month + '月' : '\u00a0';

      const date = document.createElement('span');
      date.className = 'date';
      date.textContent = day.day;

      const name = document.createElement('span');
      name.textContent = '(' + day.dayName + ')';

      th.appendChild(month);
      th.appendChild(date);
      th.appendChild(name);
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    // 本体（時間 × 日付）
    const tbody = document.createElement('tbody');
    data.times.forEach(function(time) {
      const tr = document.createElement('tr');

      const timeCell = document.createElement('td');
      timeCell.className = 'time';
      timeCell.textContent = time;
      tr.appendChild(timeCell);

      data.days.forEach(function(day) {
        const td = document.createElement('td');
        td.className = 'cell';

        if (day.status !== 'open') {
          td.className += ' off';                       // 定休日・過ぎた日・受付期間外
        } else if (day.slots.indexOf(time) !== -1) {
          td.appendChild(createSlotLink(day, time));    // 空いている → ○
        } else {
          td.className += ' full';                      // 埋まっている → ×
          td.textContent = '×';
        }
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    const area = document.getElementById('calendar');
    area.innerHTML = '';
    area.appendChild(table);

    const hasSlot = data.days.some(function(day) { return day.slots.length > 0; });
    if (!hasSlot) {
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.textContent = 'この週は空きがありません。「次の週」か「直近の空き」をお試しください。';
      area.appendChild(msg);
    }

    setButtons(true);
  }

  // ○ のボタン（タップすると、日時をメッセージとして送って閉じる）
  // 管理者の日時変更（achange）は、どの予約のカレンダーかを、文の最後に「［行番号］」で付ける
  // （ボットが、今選んでいる予約と同じか確かめる。古いカレンダーで、別の予約を変えないように）
  function createSlotLink(day, time) {
    const verb = isChangeMode() ? 'に変更' : 'で予約';
    const mark = (CONFIG.mode === 'achange' && /^\d+$/.test(CONFIG.exclude)) ? '［' + CONFIG.exclude + '］' : '';
    const text = day.month + '月' + day.day + '日（' + day.dayName + '）' + time + verb + '（' + CONFIG.menu + '）' + mark;
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '○';
    button.className = 'slot';
    button.addEventListener('click', function() { sendSelection(text); });
    return button;
  }

  // 選んだ日時（または「メニューを選び直す」）を、お客様の発言としてトークに送って閉じる
  function sendSelection(text) {
    if (sending) return;
    sending = true;
    setSending(true);

    liff.sendMessages([{ type: 'text', text: text }])
      .then(function() {
        liff.closeWindow();
      })
      .catch(function() {
        sending = false;
        setSending(false);
        alert('送信できませんでした。お手数ですが、もう一度お試しください。');
      });
  }

  // 送信中は、○ と「メニューを選び直す」を押せなくする（連打を防ぐ）
  function setSending(on) {
    document.querySelectorAll('button.slot').forEach(function(b) { b.disabled = on; });
    document.getElementById('btn-menu').disabled = on;
  }

  function showMessage(text, isError) {
    const area = document.getElementById('calendar');
    area.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'message' + (isError ? ' error' : '');
    msg.textContent = text;
    area.appendChild(msg);
  }

  function setButtons(enabled) {
    document.getElementById('btn-first').disabled = !enabled;
    document.getElementById('btn-prev').disabled = !enabled || !current || !current.prevWeek;
    document.getElementById('btn-next').disabled = !enabled || !current || !current.nextWeek;
  }

  document.getElementById('btn-menu').addEventListener('click', function() {
    sendSelection('メニューを選び直す');
  });
  document.getElementById('btn-first').addEventListener('click', function() {
    if (allData) showFirst();
  });
  document.getElementById('btn-prev').addEventListener('click', function() {
    if (allData && weekIndex > 0) showWeek(weekIndex - 1);
  });
  document.getElementById('btn-next').addEventListener('click', function() {
    if (allData && weekIndex < allData.weeks.length - 1) showWeek(weekIndex + 1);
  });

  // 待ち時間を減らすため、LIFFの準備と空き状況の読み込みを同時に始める
  renderSkeleton();

  // 日時変更か（change：お客様の変更 / achange：管理者の変更）
  // proxy（管理者の代理予約）は新しい予約なので、変更には含めない
  function isChangeMode() {
    return CONFIG.mode === 'change' || CONFIG.mode === 'achange';
  }

  // URLから、メニューと（日時変更のときは）変更の情報を読み取る
  function readParams() {
    const params = new URLSearchParams(window.location.search);
    CONFIG.menu = params.get('menu') || '';
    CONFIG.exclude = params.get('exclude') || '';
    CONFIG.mode = params.get('mode') || '';

    // 日時変更のときは、メニューは変更の対象ではないので「メニューを選び直す」を出さない
    document.getElementById('btn-menu').style.display = isChangeMode() ? 'none' : 'block';

    if (isChangeMode()) {
      document.querySelector('h1').textContent = '変更先の日時をお選びください';
      document.querySelector('.note').textContent = '変更先の日時の ○ をタップすると、その日時に変更されます。';
    }
  }

  function requestAll() {
    return fetchData({ action: 'all', menu: CONFIG.menu, exclude: CONFIG.exclude, mode: CONFIG.mode });
  }

  readParams();
  setButtons(false);
  let dataPromise = CONFIG.menu ? requestAll() : null;
  if (dataPromise) dataPromise.catch(function() {});  // 失敗は下でまとめて扱う

  liff.init({ liffId: LIFF_ID })
    .then(function() {
      if (!liff.isInClient()) {
        showMessage('このページは、LINEアプリから開いてください。', true);
        return;
      }

      // 開き方によっては、準備のあとでメニューがわかる場合がある
      if (!CONFIG.menu) {
        readParams();
        if (!CONFIG.menu) {
          showMessage('メニューが選ばれていません。LINEのトーク画面から開き直してください。', true);
          return;
        }
        dataPromise = requestAll();
      }

      return dataPromise.then(handleData).catch(showLoadError);
    })
    .catch(function(e) {
      showMessage('カレンダーを開けませんでした。LINEのトーク画面から開き直してください。（' + (e && e.message) + '）', true);
    });
</script>
</body>
</html>
